name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Use the Go that setup-go installs, never a toolchain go.mod asks for.
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile pins the dev image's Go; use the same one here.
      - id: go
        run: echo "version=$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - run: make
      - run: make check-race

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The tag bin/dev runs; load puts the image in the runner's Docker.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: mirrormark-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bin/dev run make check-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: build/e2e-logs/
          if-no-files-found: ignore
